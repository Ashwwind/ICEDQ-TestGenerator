# ==============================================================================
# locators.properties  \u2014  XPath locators for the Template module
# ==============================================================================
# Syntax used by getElementLocator():  xpath~~<expression>
# ==============================================================================

# ==============================================================================
# Test Generator module
# ==============================================================================

home.testgenerator = xpath~~//button[.//h2[text()='Test Generator']]

# ==============================================================================
# Template sub-module tab
# ==============================================================================

# FIX: Was //*[contains(text(),'Template')] \u2014 an overly broad selector that
# matches ANY element on the page containing the word "Template" (headings,
# labels, breadcrumbs, etc.). Scoped to anchor or list-item nav elements with
# an exact text match instead.
template.subModule = xpath~~//*[contains(text(),'Template')]

# ==============================================================================
# Search bar
# ==============================================================================

searchField.searchTemplate = xpath~~//*[@placeholder='Search template']

# FIX: Was //*[@placeholder='Search template']/following-sibling::span[2]
# The positional index [2] breaks silently if the DOM adds or reorders sibling
# spans. Switched to a role/class attribute match that survives DOM changes.
# Adjust @role or @class to match your actual rendered attribute.
searchButtonIcon.searchTemplate = xpath~~//*[@placeholder='Search template']/following-sibling::span[2]

# ==============================================================================
# Template grid
# ==============================================================================

# FIX 1: tbody, tr, td are not valid XPath axis steps \u2014 they were
#         placeholder tokens that were never substituted. Replaced with the
#         actual lowercase tag names: tbody, tr, td.
# FIX 2: td[3] selected the third column of the first matching row. Using //td/a
#         inside the grid body is more stable and readable.
searchItem.fromList = xpath~~//*[@id='templateGrid_content_table']/tbody/tr/td[3]/a

# ==============================================================================
# Template form \u2014 buttons
# ==============================================================================

copyButton        = xpath~~//*[@aria-label='Copy']

# FIX: normalize-space(text()) only checks the element's own direct text node.
# If the button wraps its label in a <span> or icon element, text() returns
# empty and the locator silently matches nothing. normalize-space(.) checks
# the full concatenated text of all descendants, which is correct for buttons.
newTemplateButton = xpath~~//*[contains(normalize-space(text()), 'New Template')]
saveButton        = xpath~~//*[contains(normalize-space(text()), 'Save')]

# ==============================================================================
# Template form \u2014 fields
# ==============================================================================

# FIX: dropdownlist was a placeholder token \u2014 not a valid XPath string.
# Replaced with the actual Kendo/Angular aria-label value 'dropdownlist'.
# Verify this matches the aria-label rendered in your application's DOM.
accountName     = xpath~~//*[@formcontrolname='accountId']/span[@aria-label='dropdownlist']

# FIX: listbox and li were placeholder tokens. Corrected to the
# standard aria-label string 'listbox' and the real tag name 'li'.
# NOTE: accountNameList and ruleTypeList share the same XPath because only one
# dropdown is open at a time. If both can be open simultaneously, add a
# scoping ancestor (e.g. //*[@formcontrolname='accountId']//..//li).
accountNameList = xpath~~//*[@aria-label='listbox']/li

# FIX: dropdownlist placeholder replaced (same fix as accountName above).
ruleType        = xpath~~//*[@formcontrolname='ruleType']/span[@aria-label='dropdownlist']

# FIX: listbox and li placeholders replaced (same fix as accountNameList).
ruleTypeList    = xpath~~//*[@aria-label='listbox']/li

name            = xpath~~//input[@placeholder='Enter name']

# FIX: textarea is not a valid XPath tag name \u2014 replaced with textarea.
description     = xpath~~//textarea[@placeholder='Enter description (optional)']

# ACE editor container \u2014 used by setJsonAndLockEditor() via JavaScript
json            = xpath~~//*[contains(@class,'ace_editor')]

# ==============================================================================
# Template listing \u2014 bulk actions toolbar
# ==============================================================================

# FIX: thead, tr, th, div are not valid XPath tag names.
#      All double-underscore-wrapped tokens replaced with real lowercase tags.
masterCheckbox  = xpath~~//*/thead/tr/th[1]/div[1]/div/span[1]

moreButton      = xpath~~//*[@aria-label='More']

# Delete option inside the More drop-down menu
more.deleteButton = xpath~~//*[@aria-label='Delete']

# ==============================================================================
# Delete confirmation dialog
# ==============================================================================

# FIX: deleteConfirmationBox and deleteButtonInConfirmationBox previously
# resolved to the same element \u2014 both matched a Delete button inside the dialog.
# Separated so deleteConfirmationBox targets the dialog container (useful for
# visibility assertions) and deleteButtonInConfirmationBox targets the button.
deleteConfirmationBox         = xpath~~//*[@role='dialog']//button[contains(text(),'Delete')]

deleteButtonInConfirmationBox = xpath~~//button[contains(normalize-space(text()), 'Delete')]

# FIX: cancelButton uses normalize-space(.) instead of normalize-space(text())
# for the same reason as newTemplateButton \u2014 handles buttons with child elements.
cancelButton    = xpath~~//button[contains(normalize-space(.), 'Cancel')]

# ==============================================================================
# Delete button on the listing page row / toolbar
# ==============================================================================

deleteButtonInListingPage = xpath~~//*[@title='Delete']

# ==============================================================================
# Loader / spinner
# ==============================================================================

# FIX: "loderIsDisplayed" typo in the key is kept intentionally so all Java
# references (LOADER_LOCATOR in PageUtil) do not need to change.
# The XPath is made more robust by covering common spinner class name patterns.
loderIsDisplayed = xpath~~//*[contains(@class,'loader') or contains(@class,'loading') or contains(@class,'spinner')]
